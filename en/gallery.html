    <aside class="sidebar" aria-label="Pages">

          <p class="sidebar__label">pages</p>
          <div class="lang-switch lang-switch--mobile" aria-label="Switch language">
            <button type="button" data-lang-choice="pt-BR" data-lang-target="/gallery" aria-pressed="false">PT</button>
            <span class="lang-switch__sep">/</span>
            <button type="button" class="is-active" data-lang-choice="en" data-lang-target="/en/gallery" aria-pressed="true">EN</button>
          </div>
        </div>
        <nav class="sidebar__nav">
          <a href="/en">00. index</a>

          <a href="/en/site">07. this site</a>
        </nav>
      </div>
    </aside>

    <main class="main">
      <div class="content content--gallery">
        <div class="status-bar">
          <div class="status-bar__slot status-bar__slot--left"></div>
          <div class="status-bar__slot status-bar__slot--right">
            <div class="lang-switch lang-switch--desktop" aria-label="Switch language">
              <button type="button" data-lang-choice="pt-BR" data-lang-target="/gallery" aria-pressed="false">PT</button>
              <span class="lang-switch__sep">/</span>
              <button type="button" class="is-active" data-lang-choice="en" data-lang-target="/en/gallery" aria-pressed="true">EN</button>
            </div>
          </div>
        </div>

        <header class="hero">
          <p class="eyebrow">Gallery</p>
          <h1>A visual puzzle</h1>
          <p class="subtitle">Illustrations, characters and scenes from Bero's world, arranged like a board.</p>
        </header>

        <section class="section" aria-labelledby="gallery-title">
          <div class="section-head">
            <span class="section-id">06.</span>
            <h2 id="gallery-title">Collection</h2>
          </div>
          <div class="gallery">
            <figure class="gallery__item">
              <a class="gallery__frame" href="/public/assets/mansao-dev.png" target="_blank" rel="noopener noreferrer">
                <img src="/public/assets/mansao-dev.png" alt="Mansao Dev — a black-and-white scene from one of Bero's animations" width="2880" height="1620" loading="eager" decoding="async">
                <span class="gallery__dot gallery__dot--tl"></span>
                <span class="gallery__dot gallery__dot--tr"></span>
                <span class="gallery__dot gallery__dot--bl"></span>
                <span class="gallery__dot gallery__dot--br"></span>
              </a>
            </figure>

            <figure class="gallery__item">
              <a class="gallery__frame" href="/public/assets/bero-pingu.png" target="_blank" rel="noopener noreferrer">
                <img src="/public/assets/bero-pingu.png" alt="Bero illustrated in cartoon style, wearing a tie" width="906" height="1600" loading="lazy" decoding="async">
                <span class="gallery__dot gallery__dot--tl"></span>
                <span class="gallery__dot gallery__dot--tr"></span>
                <span class="gallery__dot gallery__dot--bl"></span>
                <span class="gallery__dot gallery__dot--br"></span>
              </a>
            </figure>

            <figure class="gallery__item">
              <a class="gallery__frame" href="/public/assets/bero-sunset.png" target="_blank" rel="noopener noreferrer">
                <img src="/public/assets/bero-sunset.png" alt="One of Bero's characters watching the sunset under a tree" width="1920" height="1080" loading="lazy" decoding="async">
                <span class="gallery__dot gallery__dot--tl"></span>
                <span class="gallery__dot gallery__dot--tr"></span>
                <span class="gallery__dot gallery__dot--bl"></span>
                <span class="gallery__dot gallery__dot--br"></span>
              </a>
            </figure>

            <figure class="gallery__item">
              <a class="gallery__frame" href="/public/assets/cat-n-lucy.png" target="_blank" rel="noopener noreferrer">
                <img src="/public/assets/cat-n-lucy.png" alt="Cat and Lucy, two characters illustrated by Bero" width="1600" height="1000" loading="lazy" decoding="async">
                <span class="gallery__dot gallery__dot--tl"></span>
                <span class="gallery__dot gallery__dot--tr"></span>
                <span class="gallery__dot gallery__dot--bl"></span>
                <span class="gallery__dot gallery__dot--br"></span>
              </a>
            </figure>

            <figure class="gallery__item">
              <a class="gallery__frame" href="/public/assets/dudu.png" target="_blank" rel="noopener noreferrer">
                <img src="/public/assets/dudu.png" alt="Dudu the dog holding a tennis ball" width="1600" height="1000" loading="lazy" decoding="async">
                <span class="gallery__dot gallery__dot--tl"></span>
                <span class="gallery__dot gallery__dot--tr"></span>
                <span class="gallery__dot gallery__dot--bl"></span>
                <span class="gallery__dot gallery__dot--br"></span>
              </a>
            </figure>

          <p>bero.land</p>
        </footer>
